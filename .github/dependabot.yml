version: 2

updates:
  # Keeps actions/checkout, actions/setup-python etc. current. Without this they
  # quietly rot until a runner deprecation breaks CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    # Without grouping, dependabot opens one PR per action, which on a repo with
    # five workflow steps means five near-identical PRs a month. One grouped PR
    # gets the same CI verification with a fraction of the noise.
    groups:
      github-actions:
        patterns:
          - "*"

  # Only reaches the pinned tooling (ruff) - the runtime deps use lower bounds,
  # which dependabot leaves alone.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      python-tooling:
        patterns:
          - "*"
